# FamilyTrip nginx 站点（模板）
# ============================================================================
# 用法：cp nginx-family-trip.conf /etc/nginx/sites-available/family-trip
#      ln -s /etc/nginx/sites-enabled/family-trip
#      # 证书就位前先只启用 80 段的跳转，certbot 会自动补 443 段
#      sudo nginx -t && sudo systemctl reload nginx
#
# 前置：域名已备案并解析到 82.156.30.50；certbot 已签发证书
#      （sudo certbot --nginx -d api.<你的域名>）
# 证书路径按 certbot 实际签发结果调整（默认 /etc/letsencrypt/live/<域名>/）

# ── 80 → 443 强制跳转（微信小程序合法域名必须 HTTPS）──────────
server {
    listen 80;
    listen [::]:80;
    server_name api.<你的域名>;

    # certbot 续期校验路径（必须放行，否则续期失败）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 443 反向代理到 NestJS（pm2 family-trip :3000）────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.<你的域名>;

    ssl_certificate     /etc/letsencrypt/live/api.<你的域名>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.<你的域名>/privkey.pem;

    # TLS 基线：1.2+，禁用弱套件
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # 响应体是 JSON 信封（KB 级），开 gzip 省带宽；4Mbps 机器值得开
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 256;

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 请求体上限（JSON API，1MB 足够；头像走媒体链路不经过这里）
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # 客户端真实 IP 透传（限流/日志排障需要）
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # 小程序 API 超时比默认 60s 短更合理（微信端默认 10s 等待）
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # 健康检查端点（HealthController，GET /health 返回 { status: 'up' } 信封）
    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        access_log off;
    }
}
