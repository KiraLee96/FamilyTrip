# FamilyTrip nginx 站点（模板）
# ============================================================================
# 用法：cp nginx-family-trip.conf /etc/nginx/sites-available/family-trip
#      ln -s /etc/nginx/sites-enabled/family-trip
#      # 证书就位前先只启用 80 段的跳转，certbot 会自动补 443 段
#      sudo nginx -t && sudo systemctl reload nginx
#
# 前置：域名已备案并解析到 82.156.30.50；certbot 已签发证书
#      （sudo certbot --nginx -d api.familytripallinone.cn）
# 证书路径按 certbot 实际签发结果调整（默认 /etc/letsencrypt/live/<域名>/）
#
# 🔴 共机红线：该机 nginx 已有且只有一个站点
#    sites-enabled/default -> sites-available/food-api
#    （listen 80; server_name 82.156.30.50; /api/ 反代 127.0.0.1:5050）
#    那是另一个在跑的服务。本文件是**新增**站点，靠 server_name 分流共存：
#    ① 不要改/删 food-api；② 不要给本文件加 default_server；
#    ③ 本文件不要 listen 80 且不带 server_name（会抢默认站点）。

# ── 80 → 443 强制跳转（微信小程序合法域名必须 HTTPS）──────────
server {
    listen 80;
    listen [::]:80;
    server_name api.familytripallinone.cn;

    # certbot 续期校验路径（必须放行，否则续期失败）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── 443 反向代理到 NestJS（pm2 family-trip :3010）────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.familytripallinone.cn;

    ssl_certificate     /etc/letsencrypt/live/api.familytripallinone.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.familytripallinone.cn/privkey.pem;

    # TLS 基线：1.2+，禁用弱套件
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # 响应体是 JSON 信封（KB 级），开 gzip 省带宽；4Mbps 机器值得开
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 256;

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 请求体上限（JSON API，1MB 足够）
    client_max_body_size 1m;

    # ── 媒体文件（D-2026-10-26-04）──────────────────────────────────
    # 两条前缀规则，缺一条上传链路就断：
    #   ① /media-files/upload  收单端点 → 反代到 Node（multipart 大文件）
    #   ② /media-files/        其余 → nginx 静态直出（不耗 Node CPU）
    #
    # 🔴 顺序不能反：nginx 前缀匹配取最长匹配，`/upload` 更具体会先命中；
    #    但两者都必须在 `location /` 之前写好可读性（nginx 自动按长度优先，与书写顺序无关）。
    #
    # 目录必须与 apps/server/.env 的 OBJECT_STORAGE_ROOT 一致。
    # 上限 50MB 与库级 CHECK（chk_fp_size ≤ 52428800）对齐：
    # nginx 放得比库大 → 「传成功但 confirm 失败」；放得比库小 → 大文件传不上去。
    location /media-files/upload {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;

        client_max_body_size 50m;
        # 手机 4M 上行传 10MB 照片要 20s+，别用默认 60s 之外的短超时
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_request_buffering off; # 边收边转，避免先在 nginx 落临时盘
    }

    location /media-files/ {
        alias /home/ubuntu/ft-media/;
        # 🔴 不猜类型：未知扩展名一律按二进制下发（防把上传的 .html 当页面执行 → 同域 XSS）
        default_type application/octet-stream;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=3600";
        # 目录遍历兜底（fileKey 由服务端生成，这里是第二道闸）
        autoindex off;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;

        # 客户端真实 IP 透传（限流/日志排障需要）
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;

        # 小程序 API 超时比默认 60s 短更合理（微信端默认 10s 等待）
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # 健康检查端点（HealthController，GET /health 返回 { status: 'up' } 信封）
    location = /health {
        proxy_pass http://127.0.0.1:3010/health;
        access_log off;
    }
}
